<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EMS</title>
<link rel="stylesheet" href="index.css">
</head>
<body>
<div class="container">
<h1>Encrypted Messaging System</h1>

<div class="block">
<span>Plain Text</span>
<textarea id="encode-text"></textarea>
</div>

<div class="block">
<span>Encrypted</span>
<div class="row">
<input id="encoded-text" readonly>
<button id="copy">Copy</button>
</div>
</div>

<div class="block">
<span>Encrypted Input</span>
<input id="decode-text">
</div>

<div class="block">
<span>Decoded</span>
<textarea id="decoded-text" readonly></textarea>
</div>

</div>
<script src="index.js"></script>
</body>
</html>
